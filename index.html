<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バースデークエスト - 伝説のたんじょうび</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap');

  :root {
    --dq-bg: #050505;
    --dq-border: #f8fafc;
    --dq-box: #0a0a0a;
  }

  body {
    background-color: var(--dq-bg);
    color: #ffffff;
    font-family: 'DotGothic16', monospace, sans-serif;
    user-select: none;
    touch-action: manipulation;
  }

  /* ドラクエ伝統のダブルホワイトボーダー */
  .dq-window {
    background-color: var(--dq-box);
    border: 4px solid #ffffff;
    border-radius: 8px;
    box-shadow: inset 0 0 0 2px #000000, 0 0 15px rgba(255, 255, 255, 0.15);
    position: relative;
  }

  .dq-btn {
    background: transparent;
    border: 2px solid transparent;
    transition: all 0.15s ease;
    cursor: pointer;
    font-size: 1.15rem;
    line-height: 1.8;
  }

  .dq-btn:hover:not(:disabled), .dq-btn:focus:not(:disabled) {
    border-color: #ffffff;
    background-color: rgba(255, 255, 255, 0.1);
  }

  .dq-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* レトロアニメーション */
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-8px, 4px); }
    40% { transform: translate(8px, -4px); }
    60% { transform: translate(-6px, -2px); }
    80% { transform: translate(6px, 3px); }
  }

  @keyframes flash-damage {
    0%, 100% { opacity: 1; filter: none; }
    50% { opacity: 0.1; filter: drop-shadow(0 0 12px #ef4444); }
  }

  @keyframes flash-powerful {
    0%, 100% { opacity: 1; filter: none; }
    25% { opacity: 0.2; filter: drop-shadow(0 0 20px #fbbf24); }
    50% { opacity: 0.9; filter: drop-shadow(0 0 30px #ef4444); }
    75% { opacity: 0.1; filter: drop-shadow(0 0 20px #fbbf24); }
  }

  @keyframes float-idle {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }

  .anim-shake {
    animation: shake 0.35s cubic-bezier(.36,.07,.19,.97) both;
  }

  .anim-damage {
    animation: flash-damage 0.35s ease-in-out both;
  }

  .anim-powerful {
    animation: flash-powerful 0.5s ease-in-out both;
  }

  .anim-idle {
    animation: float-idle 2.6s ease-in-out infinite;
  }

  /* テキストカーソルの点滅 */
  .cursor-blink::after {
    content: "▼";
    display: inline-block;
    margin-left: 6px;
    animation: blink 0.8s infinite steps(1);
    color: #facc15;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  /* 紙吹雪Canvas */
  #confetti-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 50;
  }
</style>
</head>

<script>
// ========================================================
// 8-bit Web Audio API サウンドシステム（ファミコン風音源）
// ========================================================
class ChiptuneAudio {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.isPlayingBgm = false;
    this.bgmTimeouts = [];
  }

  init() {
    if (!this.ctx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContextClass();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    if (this.muted) {
      this.stopMelody();
    }
    return !this.muted;
  }

  // 短い単音トーン生成
  playTone(freq, type = 'square', duration = 0.1, gainVal = 0.1, startDelay = 0) {
    if (this.muted) return;
    this.init();
    const t = this.ctx.currentTime + startDelay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);

    gain.gain.setValueAtTime(gainVal, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

    osc.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start(t);
    osc.stop(t + duration);
  }

  // こうげき音
  playAttackSound() {
    if (this.muted) return;
    this.init();
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(320, t);
    osc.frequency.exponentialRampToValueAtTime(60, t + 0.12);
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.linearRampToValueAtTime(0.001, t + 0.12);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.12);
  }

  // 呪文音（ギラ/通常）
  playMagicSound() {
    if (this.muted) return;
    this.init();
    [350, 440, 523, 659, 784, 1046].forEach((f, i) => {
      this.playTone(f, 'square', 0.08, 0.1, i * 0.04);
    });
  }

  // 強力呪文音（ベギラマ用）
  playBigMagicSound() {
    if (this.muted) return;
    this.init();
    [261, 330, 392, 523, 659, 784, 1046, 1318, 1568].forEach((f, i) => {
      this.playTone(f, 'sawtooth', 0.09, 0.12, i * 0.035);
    });
  }

  // 回復（ホイミ）音
  playHealSound() {
    if (this.muted) return;
    this.init();
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
      this.playTone(f, 'triangle', 0.15, 0.15, i * 0.07);
    });
  }

  // 上位回復（ベホイミ）音
  playBigHealSound() {
    if (this.muted) return;
    this.init();
    [392.00, 523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
      this.playTone(f, 'triangle', 0.18, 0.18, i * 0.06);
    });
  }

  // 被ダメージ音
  playDamageSound() {
    if (this.muted) return;
    this.init();
    this.playTone(110, 'sawtooth', 0.18, 0.22);
    this.playTone(90, 'square', 0.18, 0.18);
  }

  // 撃破ファンファーレ
  playFanfare() {
    if (this.muted) return;
    this.init();
    const notes = [
      { f: 523.25, d: 0.12 },
      { f: 523.25, d: 0.12 },
      { f: 523.25, d: 0.12 },
      { f: 659.25, d: 0.35 }
    ];
    let time = 0;
    notes.forEach(n => {
      this.playTone(n.f, 'square', n.d, 0.15, time);
      time += n.d + 0.03;
    });
  }

  // 呪文習得・パワーアップファンファーレ
  playPowerUpFanfare() {
    if (this.muted) return;
    this.init();
    const notes = [
      { f: 392.00, d: 0.1 },
      { f: 440.00, d: 0.1 },
      { f: 523.25, d: 0.1 },
      { f: 659.25, d: 0.12 },
      { f: 783.99, d: 0.15 },
      { f: 1046.50, d: 0.35 }
    ];
    let time = 0;
    notes.forEach(n => {
      this.playTone(n.f, 'square', n.d, 0.16, time);
      time += n.d + 0.02;
    });
  }

  // ボス撃破時の「ハッピーバースデートゥーユー」メロディ演奏
  playHappyBirthdayMelody() {
    if (this.muted) return;
    this.init();
    this.stopMelody();
    this.isPlayingBgm = true;
    document.getElementById('bgm-indicator').classList.remove('hidden');

    const G4 = 392.00, A4 = 440.00, B4 = 493.88;
    const C5 = 523.25, D5 = 587.33, E5 = 659.25, F5 = 698.46, G5 = 783.99;

    const beat = 0.45;
    const melody = [
      // Hap-py Birth-day to you
      { f: G4, d: 0.75 }, { f: G4, d: 0.25 }, { f: A4, d: 1.0 }, { f: G4, d: 1.0 }, { f: C5, d: 1.0 }, { f: B4, d: 2.0 },
      // Hap-py Birth-day to you
      { f: G4, d: 0.75 }, { f: G4, d: 0.25 }, { f: A4, d: 1.0 }, { f: G4, d: 1.0 }, { f: D5, d: 1.0 }, { f: C5, d: 2.0 },
      // Hap-py Birth-day dear (Hero)
      { f: G4, d: 0.75 }, { f: G4, d: 0.25 }, { f: G5, d: 1.0 }, { f: E5, d: 1.0 }, { f: C5, d: 1.0 }, { f: B4, d: 1.0 }, { f: A4, d: 1.5 },
      // Hap-py Birth-day to you!
      { f: F5, d: 0.75 }, { f: F5, d: 0.25 }, { f: E5, d: 1.0 }, { f: C5, d: 1.0 }, { f: D5, d: 1.0 }, { f: C5, d: 2.5 }
    ];

    let current = 0.1;
    melody.forEach((note) => {
      const duration = note.d * beat;
      const tid = setTimeout(() => {
        if (!this.muted && this.isPlayingBgm) {
          this.playTone(note.f, 'square', duration * 0.9, 0.18);
          this.playTone(note.f / 2, 'triangle', duration * 0.9, 0.12);
        }
      }, current * 1000);
      this.bgmTimeouts.push(tid);
      current += duration;
    });

    const finishTid = setTimeout(() => {
      this.isPlayingBgm = false;
      document.getElementById('bgm-indicator').classList.add('hidden');
    }, current * 1000);
    this.bgmTimeouts.push(finishTid);
  }

  stopMelody() {
    this.bgmTimeouts.forEach(t => clearTimeout(t));
    this.bgmTimeouts = [];
    this.isPlayingBgm = false;
    document.getElementById('bgm-indicator')?.classList.add('hidden');
  }
}

const audio = new ChiptuneAudio();

// ========================================================
// ゲームデータ定義（3連戦：ケーキ → ごちそう → プレゼント）
// ========================================================
const MONSTER_SVGS = {
  // 1. ショートスライム（イチゴショートケーキを冠した牙付き魔物スライム）
  slime: `
    <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-[0_4px_14px_rgba(56,189,248,0.5)]">
      <!-- スライム本体（しずく型） -->
      <path d="M50 16 C30 16 16 42 16 64 C16 82 30 92 50 92 C70 92 84 82 84 64 C84 42 70 16 50 16 Z" fill="#0284c7" stroke="#082f49" stroke-width="2.5"/>
      <path d="M50 20 C66 20 78 44 78 64 C78 78 66 87 50 87 C34 87 22 78 22 64 C22 44 34 20 50 20 Z" fill="#38bdf8"/>
      <!-- ハイライト -->
      <ellipse cx="33" cy="40" rx="5" ry="9" transform="rotate(-25 33 40)" fill="#bae6fd" opacity="0.85"/>
      <!-- 生クリームのドリップ飾り -->
      <path d="M30 40 Q40 46 50 38 Q60 46 70 40 Q75 32 68 28 Q50 22 32 28 Q25 32 30 40 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="50" cy="24" r="7" fill="#ef4444"/>
      <circle cx="48" cy="22" r="1.5" fill="#fef08a"/>
      <!-- ろうそくと揺れる炎 -->

// ========================================================
// UI・タイプライター演出ロジック
// ========================================================
function logMessage(text, callback = null) {
  const msgEl = document.getElementById('message-text');
  const hintEl = document.getElementById('continue-hint');
  
  if (gameState.typingTimer) {
    clearTimeout(gameState.typingTimer);
    gameState.typingTimer = null;
  }

  msgEl.innerText = "";
  hintEl.classList.add('hidden');
  
  let i = 0;
  function typeChar() {
    if (i < text.length) {
      msgEl.innerText += text.charAt(i);
      i++;
      gameState.typingTimer = setTimeout(typeChar, 24);
    } else {
      gameState.typingTimer = null;
      if (callback) callback();
    }
  }
  typeChar();
}

function updateHeroUI() {
  const h = gameState.hero;
  document.getElementById('hero-name-label').innerText = `勇者 ${h.name}`;
  document.getElementById('hero-lv-label').innerText = `Lv. ${h.level}`;

// プロローグ専用のタイピング表示
let prologueTimer = null;
function showPrologue(heroName, onComplete) {
  const prologueScreen = document.getElementById('prologue-screen');
  const prologueTextEl = document.getElementById('prologue-text');
  const hintEl = document.getElementById('prologue-continue-hint');

  prologueScreen.classList.remove('hidden');
  prologueTextEl.innerText = "";
  hintEl.classList.add('hidden');

  const story = 
    `きょうは ${heroName}の 特別な誕生日。\n\n` +
    `しかし、誕生日パーティーに必要な\n` +
    `大切な宝物が 魔物たちに奪われてしまった！\n\n` +
    `${heroName}は 宝を取り戻し、最高の誕生日を\n` +
    `迎えるため 冒険の旅へ出た！`;

  let i = 0;
  let isDone = false;

  function finishTyping() {
    if (isDone) return;
    isDone = true;
    if (prologueTimer) clearTimeout(prologueTimer);
    prologueTextEl.innerText = story;
    hintEl.classList.remove('hidden');
  }

  function typeChar() {
    if (i < story.length) {
      prologueTextEl.innerText += story.charAt(i);
      i++;
      prologueTimer = setTimeout(typeChar, 28);
    } else {
      finishTyping();
    }
  }

  typeChar();

  const clickHandler = () => {
    if (!isDone) {
      finishTyping();
    } else {
      document.getElementById('prologue-box').removeEventListener('click', clickHandler);
      prologueScreen.classList.add('hidden');
      onComplete();
    }
  };

  document.getElementById('prologue-box').addEventListener('click', clickHandler);
}

  const m = gameState.currentMonster;
  const spriteEl = document.getElementById('monster-sprite');

  const barEl = document.getElementById('monster-hp-bar');

  if (!m) return;
  spriteEl.innerHTML = m.sprite;
  nameEl.innerText = `${m.name}`;

  const pct = Math.max(0, (gameState.monsterHp / m.maxHp) * 100);
  barEl.style.width = `${pct}%`;

    barEl.className = "bg-emerald-500 h-full transition-all duration-200";
  } else if (pct > 20) {
    barEl.className = "bg-yellow-400 h-full transition-all duration-200";
  } else {
    barEl.className = "bg-red-500 h-full transition-all duration-200";
  }
}

// ========================================================
// バトル進行・ステージ管理
// ========================================================
function startStage(stageIdx) {
  gameState.stageIndex = stageIdx;
  const m = STAGES[stageIdx];
  gameState.currentMonster = m;
  gameState.monsterHp = m.maxHp;
  gameState.isBusy = true;
  setButtonsEnabled(false);

  updateMonsterUI();
  
  const container = document.getElementById('monster-container');
  container.classList.remove('anim-shake', 'anim-damage', 'anim-powerful');
  container.style.opacity = '1';

  logMessage(m.encounterMsg, () => {
    gameState.isBusy = false;
    setButtonsEnabled(true);
  });
}

// プレイヤーコマンド処理
function handlePlayerAction(action) {
  if (gameState.isBusy || gameState.hero.hp <= 0 || gameState.monsterHp <= 0) return;
  audio.init();
  gameState.isBusy = true;
  setButtonsEnabled(false);

  const hero = gameState.hero;
  const monster = gameState.currentMonster;
  const container = document.getElementById('monster-container');

  if (action === 'attack') {
    const isCritical = Math.random() < 0.22;
    let dmg = Math.max(2, hero.attack - monster.defense + Math.floor(Math.random() * 4) - 2);
    if (isCritical) {
      dmg = Math.floor(hero.attack * 1.65) + Math.floor(Math.random() * 5);
      audio.playMagicSound();
    } else {
      audio.playAttackSound();
    }

    container.classList.add('anim-shake', 'anim-damage');
    setTimeout(() => container.classList.remove('anim-shake', 'anim-damage'), 400);

    gameState.monsterHp = Math.max(0, gameState.monsterHp - dmg);
    updateMonsterUI();

    const attackText = isCritical
      ? `かいしんの いちげき！！\n${monster.name}に ${dmg}の ダメージを 与えた！`
      : `${hero.name}の こうげき！\n${monster.name}に ${dmg}の ダメージを 与えた！`;

    logMessage(attackText, () => {
      checkBattleResolution();
    });

  } else if (action === 'heal') {
    // ホイミ(3) or ベホイミ(6)
    const cost = hero.hasAdvancedSpells ? 6 : 3;
    const spellName = hero.hasAdvancedSpells ? "ベホイミ" : "ホイミ";

    if (hero.mp < cost) {
      audio.playTone(180, 'sawtooth', 0.15);
      logMessage("ＭＰが たりない！", () => {
        gameState.isBusy = false;
        setButtonsEnabled(true);
      });
      return;
    }

    hero.mp -= cost;
    let healVal = 0;
    if (hero.hasAdvancedSpells) {
      healVal = Math.floor(Math.random() * 16) + 50; // ベホイミ: 50〜65回復
      audio.playBigHealSound();
    } else {
      healVal = Math.floor(Math.random() * 8) + 16;  // ホイミ: 16〜23回復
      audio.playHealSound();
    }
    
    hero.hp = Math.min(hero.maxHp, hero.hp + healVal);
    updateHeroUI();

    logMessage(`${hero.name}は ${spellName}を となえた！\nキズが いえ、ＨＰが ${healVal} かいふくした！`, () => {
      setTimeout(enemyTurn, 700);
    });

  } else if (action === 'gira') {
    // ギラ(4) or ベギラマ(8)
    const cost = hero.hasAdvancedSpells ? 8 : 4;
    const spellName = hero.hasAdvancedSpells ? "ベギラマ" : "ギラ";

    if (hero.mp < cost) {
      audio.playTone(180, 'sawtooth', 0.15);
      logMessage("ＭＰが たりない！", () => {
        gameState.isBusy = false;
        setButtonsEnabled(true);
      });
      return;
    }

    hero.mp -= cost;
    let spellDmg = 0;
    if (hero.hasAdvancedSpells) {
      // ベギラマ: 38〜48ダメージの大威力
      spellDmg = Math.floor(Math.random() * 11) + 38;
      audio.playBigMagicSound();
      container.classList.add('anim-powerful', 'anim-shake');
      setTimeout(() => container.classList.remove('anim-powerful', 'anim-shake'), 500);
    } else {
      // ギラ: 18〜24ダメージ
      spellDmg = Math.floor(Math.random() * 7) + 18;
      audio.playMagicSound();
      container.classList.add('anim-damage');
      setTimeout(() => container.classList.remove('anim-damage'), 400);
    }

    gameState.monsterHp = Math.max(0, gameState.monsterHp - spellDmg);
    updateHeroUI();
    updateMonsterUI();

    const castText = hero.hasAdvancedSpells
      ? `${hero.name}は ベギラマを となえた！\nごうおんとともに 激しい雷炎が ${monster.name}を つつむ！\n${spellDmg}の 甚大なダメージ！`
      : `${hero.name}は ギラを となえた！\nせんこうが はしり ${monster.name}に ${spellDmg}の ダメージ！`;

    logMessage(castText, () => {
      checkBattleResolution();
    });

  } else if (action === 'escape') {
    if (gameState.stageIndex === 2) {
      logMessage("プレゼント大魔王の まえでは にげられない！", () => {
        setTimeout(enemyTurn, 600);
      });
      return;
    }
    
    if (Math.random() < 0.4) {
      logMessage(`${hero.name}は 逃げ出した！\n…しかし バースデーの 準備のために 戻ってきた！`, () => {
        setTimeout(() => {
          startStage(gameState.stageIndex);
        }, 800);
      });
    } else {
      logMessage(`${hero.name}は 逃げ出そうとしたが 回り込まれてしまった！`, () => {
        setTimeout(enemyTurn, 700);
      });
    }
  }
}

// 敵の撃破判定または反撃
function checkBattleResolution() {
  if (gameState.monsterHp <= 0) {
    setTimeout(handleMonsterDefeated, 700);
  } else {
    setTimeout(enemyTurn, 800);
  }
}

// 敵のターン
function enemyTurn() {
  if (gameState.monsterHp <= 0 || gameState.hero.hp <= 0) return;
  const m = gameState.currentMonster;
  const h = gameState.hero;

  let enemyDmg = Math.max(2, m.attack - h.defense + Math.floor(Math.random() * 3) - 1);
  let enemyActionText = `${m.name}の こうげき！\n${h.name}は ${enemyDmg}の ダメージを うけた！`;

  // ボスの特殊行動（クラッカー乱れ撃ち）
  if (gameState.stageIndex === 2 && Math.random() < 0.4) {
    enemyDmg += 7;
    enemyActionText = `${m.name}の クラッカーれんだ！\nパーティーの いりょくで ${h.name}は ${enemyDmg}の 大ダメージ！`;
  }

  audio.playDamageSound();
  h.hp = Math.max(0, h.hp - enemyDmg);
  updateHeroUI();

  document.body.classList.add('anim-shake');
  setTimeout(() => document.body.classList.remove('anim-shake'), 300);

  logMessage(enemyActionText, () => {
    if (h.hp <= 0) {
      setTimeout(handleGameOver, 700);
    } else {
      gameState.isBusy = false;
      setButtonsEnabled(true);
    }
  });
}

// モンスター撃破処理＆アイテムドロップ
function handleMonsterDefeated() {
  const m = gameState.currentMonster;
  audio.playFanfare();

  const container = document.getElementById('monster-container');
  container.style.opacity = '0';

  gameState.inventory[m.dropItemKey] = true;
  updateInventoryUI();

  logMessage(`${m.name}を たおした！\n${m.dropMsg}`, () => {
    setTimeout(() => {
      if (gameState.stageIndex < STAGES.length - 1) {
        levelUpHero();
      } else {
        triggerBirthdayCelebration();
      }
    }, 1400);
  });
}

// レベルアップ（2匹目撃破でベホイミ＆ベギラマ習得！）
function levelUpHero() {
  const h = gameState.hero;
  h.level += 1;

  if (gameState.stageIndex === 1) {
    // 2匹目の雑魚（ごちそうサウルス）撃破時：大幅強化＋呪文パワーアップ！
    h.maxHp += 28;
    h.hp = h.maxHp;
    h.maxMp += 16;
    h.mp = h.maxMp;
    h.attack += 12;
    h.defense += 6;
    h.hasAdvancedSpells = true; // ベホイミ・ベギラマ解禁
    
    updateHeroUI();
    audio.playPowerUpFanfare();

    const powerUpText = `ファンファーレが ひびきわたる！\n${h.name}の レベルが ${h.level}に あがった！\nなんと 【ベホイミ】と 【ベギラマ】を おぼえた！\nＨＰと ＭＰが まんたんになった！`;

    logMessage(powerUpText, () => {
      setTimeout(() => {
        startStage(gameState.stageIndex + 1);
      }, 1800);
    });

  } else {
    // 1匹目撃破時：通常のレベルアップ
    h.maxHp += 16;
    h.hp = h.maxHp;
    h.maxMp += 8;
    h.mp = h.maxMp;
    h.attack += 7;
    h.defense += 3;

    updateHeroUI();
    audio.playHealSound();

    logMessage(`パララパッパッパー♪\n${h.name}の レベルが ${h.level}に あがった！\nＨＰと ＭＰが ぜんかいふくした！`, () => {
      setTimeout(() => {
        startStage(gameState.stageIndex + 1);
      }, 1400);
    });
  }
}

// ゲームオーバー
function handleGameOver() {
  audio.playTone(80, 'sawtooth', 0.6, 0.3);
  logMessage(`勇者 ${gameState.hero.name}は ちからつきてしまった……\n[もういちど コマンドをおすと さいしょから やりなおせます]`, () => {
    gameState.isBusy = false;
    const btnAttack = document.getElementById('btn-attack');
    btnAttack.disabled = false;
    btnAttack.innerHTML = '<span class="mr-1 text-yellow-400">▶</span>ふっかつ';
    btnAttack.onclick = () => {
      btnAttack.innerHTML = '<span class="mr-1 text-yellow-400">▶</span>こうげき';
      btnAttack.onclick = () => handlePlayerAction('attack');
      resetGame();
    };
  });
}

// ========================================================
// バースデーエンディング＆紙吹雪パーティクル
// ========================================================
let confettiParticles = [];
let confettiAnimationId = null;

function triggerBirthdayCelebration() {
  audio.playHappyBirthdayMelody();

  const overlay = document.getElementById('celebration-overlay');
  overlay.classList.remove('hidden');

  const msgBox = document.getElementById('birthday-custom-msg');
  msgBox.innerText = `🎂 ${gameState.hero.name}さん おたんじょうび おめでとうございます！ 🎂\n${gameState.customBirthdayMsg}\nケーキ・ごちそう・プレゼントが すべてそろい、さいこうの バースデーが はじまる！`;

  logMessage(`★ おめでとう！！ ★\n${gameState.hero.name}は プレゼント大魔王を たおし、世界に たのしい たんじょうびを とりもどした！`, () => {
    gameState.isBusy = false;
  });

  startConfetti();
}

function startConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#ffffff'];
  confettiParticles = Array.from({ length: 90 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    size: Math.random() * 8 + 6,
    color: colors[Math.floor(Math.random() * colors.length)],
    speedY: Math.random() * 3 + 2.2,
    speedX: Math.random() * 2 - 1,
    rotation: Math.random() * 360,
    rotSpeed: Math.random() * 4 - 2
  }));

  function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confettiParticles.forEach(p => {
      p.y += p.speedY;
      p.x += Math.sin(p.y * 0.02) + p.speedX;
      p.rotation += p.rotSpeed;

      if (p.y > canvas.height) {
        p.y = -10;
        p.x = Math.random() * canvas.width;
      }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
      ctx.restore();
    });
    confettiAnimationId = requestAnimationFrame(update);
  }
  update();
}

function stopConfetti() {
  if (confettiAnimationId) {
    cancelAnimationFrame(confettiAnimationId);
    confettiAnimationId = null;
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

// ========================================================
// リセットと初期化
// ========================================================
function resetGame() {
  stopConfetti();
  audio.stopMelody();
  document.getElementById('celebration-overlay').classList.add('hidden');

  gameState.hero = {
    name: gameState.hero.name || "aya",
    level: 1,
    hp: 34,
    maxHp: 34,
    mp: 14,
    maxMp: 14,
    attack: 14,
    defense: 6,
    hasAdvancedSpells: false
  };
  gameState.inventory = {
    cake: false,
    feast: false,
    present: false
  };

  updateHeroUI();
  updateInventoryUI();
  startStage(0);
}

window.onload = function() {
  document.getElementById('btn-attack').addEventListener('click', () => handlePlayerAction('attack'));
  document.getElementById('btn-magic').addEventListener('click', () => handlePlayerAction('heal'));
  document.getElementById('btn-gira').addEventListener('click', () => handlePlayerAction('gira'));
  document.getElementById('btn-escape').addEventListener('click', () => handlePlayerAction('escape'));

  document.getElementById('restart-btn').addEventListener('click', () => {
    resetGame();
  });

  document.getElementById('sound-toggle-btn').addEventListener('click', (e) => {
    const isMuted = audio.toggleMute();
    e.target.innerText = isMuted ? '🔊 SOUND: ON' : '🔇 SOUND: OFF';
  });

  document.getElementById('msg-box').addEventListener('click', () => {
    if (gameState.typingTimer) {
      clearTimeout(gameState.typingTimer);
      gameState.typingTimer = null;
    }
  });

  // 初回スタートボタン（名前決定 ➔ プロローグ表示）
  const startBtn = document.getElementById('start-adventure-btn');
  const nameInput = document.getElementById('input-hero-name');

  startBtn.addEventListener('click', () => {
    audio.init();
    const heroName = nameInput.value.trim() || "aya";

    gameState.hero.name = heroName;
    updateHeroUI();

    // 名前決め画面を非表示にする
    document.getElementById('start-screen').classList.add('hidden');
    audio.playPowerUpFanfare();

    // プロローグ表示画面へ
    showPrologue(heroName, () => {
      // プロローグ終了後にバトル画面を表示＆第1戦スタート
      document.getElementById('game-container').classList.remove('hidden');
      startStage(0);
    });
  });

  // ゲームプレイ中の名前変更モーダル処理
  const modal = document.getElementById('modal-backdrop');
  const modalHeroName = document.getElementById('modal-hero-name');
  const modalBdayMsg = document.getElementById('modal-bday-msg');

  document.getElementById('rename-btn').addEventListener('click', () => {
    modalHeroName.value = gameState.hero.name;
    modalBdayMsg.value = gameState.customBirthdayMsg;
    modal.classList.remove('hidden');
  });

  document.getElementById('modal-close-btn').addEventListener('click', () => {
    modal.classList.add('hidden');
  });

  document.getElementById('modal-save-btn').addEventListener('click', () => {
    gameState.hero.name = modalHeroName.value.trim() || "aya";
    gameState.customBirthdayMsg = modalBdayMsg.value.trim() || "すてきな １ねんに なりますように！";
    updateHeroUI();
    modal.classList.add('hidden');
  });
};
</script>
